  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

transform:lowercase;padding:0 6px 8px;\">Inside Projects<\u002Fdiv>\n          <div class=\"nav-sub-grid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;\">\n            <sc-for list=\"{{ projectLinks }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <a onclick=\"{{ p.onClick }}\" style=\"text-decoration:none;display:block;padding:12px 14px;border-radius:16px;background:transparent;cursor:pointer;transition:background .2s;\" style-hover=\"background:var(--hover);\">\n                <sc-if value=\"{{ p.mezzo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-family:'Aleo',serif;font-style:italic;font-weight:700;font-size:16px;color:var(--text);margin-bottom:4px;\">{{ p.label }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ p.notMezzo }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--text);margin-bottom:4px;\">{{ p.label }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-size:12.5px;line-height:1.4;color:var(--muted);\">{{ p.desc }}<\u002Fdiv>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- mobile now uses the same expanding-pill (.nav-dd) panel as desktop -->\n\n<!-- ============ CONTENT ============ -->\n<main style=\"position:relative;z-index:1;\">\n\n  <!-- ===== HOME ===== -->\n  <section id=\"home\" class=\"sec sec-home reveal-sec\" data-screen-label=\"Home\" style=\"position:relative;z-index:0;isolation:isolate;max-width:1280px;margin:0 auto;padding:158px 40px 110px;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:var(--hero-layer);z-index:-1;pointer-events:none;transition:background .55s ease;\"><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:46px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:0.08em;\">001 / introduction<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);\">2026<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hero-grid\" style=\"display:grid;grid-template-columns:1.35fr 0.65fr;gap:60px;align-items:center;margin-bottom:0;\">\n      <div>\n        <h1 class=\"big\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:64px;line-height:1.02;letter-spacing:-0.03em;margin:0 0 26px;color:var(--text);\">a business brain that<br>{{ typeWord }}<\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.6;color:var(--muted);max-width:560px;margin:0 0 40px;\">Schulich BBA pairing the rigor of finance, audit, and consulting with a builder's instinct for product — I turn ambiguity into clear, buildable answers, and I'm headed toward product management.<\u002Fp>\n\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;\">\n          <button onclick=\"{{ goExperience }}\" style=\"font-family:'Space Grotesk',sans-serif;padding:13px 26px;background:var(--text);color:var(--btn-text);border:none;border-radius:100px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;\" style-hover=\"opacity:0.88;\">View experience<\u002Fbutton>\n          <button onclick=\"{{ goContact }}\" style=\"font-family:'Space Grotesk',sans-serif;padding:13px 26px;background:transparent;color:var(--text);border:1px solid var(--border-strong);border-radius:100px;font-size:15px;font-weight:600;cursor:pointer;transition:border-color .2s;\" style-hover=\"border-color:var(--text);\">Get in touch<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hero-portrait\" style=\"position:relative;\">\n        <div class=\"hero-shot\" style=\"position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--surface-3);box-shadow:0 20px 50px -30px rgba(0,0,0,0.35);border:1px solid var(--border);\">\n          <img src=\"535d5692-cc0b-4093-a36b-b8550c5ae7d4\" alt=\"Marcus Maximus\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 16%;display:block;filter:grayscale(0.2) contrast(1.03);transition:filter .55s ease;\">\n          <div class=\"hero-tint\" aria-hidden=\"true\" style=\"position:absolute;inset:0;background:linear-gradient(150deg,rgba(0,113,227,0.18),rgba(0,113,227,0.02));mix-blend-mode:multiply;transition:opacity .55s ease;pointer-events:none;\"><\u002Fdiv>\n          <div aria-hidden=\"true\" style=\"position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.16);pointer-events:none;\"><\u002Fdiv>\n          <div style=\"position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:100px;background:rgba(18,18,20,0.44);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:#34c759;flex:none;\"><\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.04em;color:#f7f7f9;\">Toronto, ON<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ===== ABOUT ===== -->\n  <section id=\"about\" class=\"sec reveal-sec\" data-screen-label=\"About\" style=\"max-width:1280px;margin:0 auto;padding:96px 40px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:46px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:0.08em;\">002 / about<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);\">Toronto, ON<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"about-grid\" style=\"display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:stretch;margin-bottom:64px;\">\n      <div style=\"display:flex;flex-direction:column;gap:30px;\">\n        <div>\n        <h1 class=\"big\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:48px;line-height:1.04;letter-spacing:-0.025em;margin:0 0 26px;\">a few things about me.<\u002Fh1>\n        <p style=\"font-size:17px;line-height:1.68;color:var(--muted);margin:0 0 18px;\">I was born in the <strong style=\"color:var(--text);font-weight:600;\">Philippines<\u002Fstrong>, where I grew up in my grandparents' house, always surrounded by family. Living that close to so many people taught me the value of community early, and it has shaped how I treat everyone I work with.<\u002Fp>\n        <p style=\"font-size:17px;line-height:1.68;color:var(--muted);margin:0;\">When I was five, my family moved to <strong style=\"color:var(--text);font-weight:600;\">Canada<\u002Fstrong>. It was a culture shock, but instead of resisting it I embraced the diversity and the change around me. That openness became my approach to life: stay curious, say yes, and figure it out as I go.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"move-grid\" style=\"background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:30px 32px;display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:0.08em;\">how i move<\u002Fdiv>\n          <p style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:23px;line-height:1.32;letter-spacing:-0.015em;color:var(--text);margin:0;\">I never turn down an opportunity I have the chance to take. If I try it and love it, I stick with it. If I don't, I move on to the next one.<\u002Fp>\n          <p style=\"font-size:15px;line-height:1.66;color:var(--muted);margin:0;\">That mindset is the thread running through everything I've done, from a summer at an immigration law firm to audit and finance, and now consulting on Deloitte's Finance Transformation team while I finish my degree at the <strong style=\"color:var(--text);font-weight:600;\">Schulich School of Business<\u002Fstrong>. Each step was a door worth walking through. The opportunity I'm chasing now is <strong style=\"color:var(--text);font-weight:600;\">product management<\u002Fstrong>, where my curiosity about people, business, and building all meet.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"headshot\" style=\"height:100%;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--surface-3);\">\n        <img src=\"535d5692-cc0b-4093-a36b-b8550c5ae7d4\" alt=\"Marcus Maximus\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:22px;letter-spacing:0.04em;\">beyond work<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;\">\n      <sc-for list=\"{{ hobbies }}\" as=\"h\" hint-placeholder-count=\"5\">\n        <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 18px;\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;margin-bottom:6px;\">{{ h.name }}<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--muted);\">{{ h.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ===== EXPERIENCE ===== -->\n  <section id=\"experience\" class=\"sec reveal-sec\" data-screen-label=\"Experience\" style=\"max-width:1280px;margin:0 auto;padding:96px 40px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:46px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:0.08em;\">003 / experience<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);\">2022 to Present<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h1 class=\"big\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:48px;line-height:1.04;letter-spacing:-0.025em;margin:0 0 48px;\">where I've worked.<\u002Fh1>\n\n    <div>\n      <sc-for list=\"{{ experiences }}\" as=\"job\" hint-placeholder-count=\"4\">\n        <div class=\"exp-row\" style=\"display:grid;grid-template-columns:172px 1fr;gap:32px;padding:30px 0;border-top:1px solid var(--border);\">\n          <div>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);font-weight:500;\">{{ job.year }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--faint);margin-top:4px;\">{{ job.type }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;\">\n              <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;letter-spacing:-0.01em;\">{{ job.role }}<\u002Fspan>\n              <span style=\"font-size:15px;color:var(--accent);font-weight:500;\">{{ job.company }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:15.5px;line-height:1.6;color:var(--muted);margin:0;max-width:560px;\">{{ job.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div class=\"exp-edu-grid\" style=\"margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:40px;\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:18px;letter-spacing:0.04em;\">education<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px;margin-bottom:4px;\">Schulich School of Business<\u002Fdiv>\n        <div style=\"font-size:14.5px;color:var(--muted);\">York University · BBA<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--faint);margin-top:6px;\">Expected 2027<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:18px;letter-spacing:0.04em;\">skills &amp; tools<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px;\">\n          <sc-for list=\"{{ skillGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div>\n              <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--text);margin-bottom:10px;\">{{ g.label }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n                <sc-for list=\"{{ g.items }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <span style=\"font-size:13.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:7px 15px;\">{{ s }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ===== PROJECTS ===== -->\n  <section id=\"projects\" class=\"sec reveal-sec\" data-screen-label=\"Projects\" style=\"max-width:1280px;margin:0 auto;padding:96px 40px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:46px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:0.08em;\">004 / projects<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);\">Selected work<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h1 class=\"big\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:48px;line-height:1.04;letter-spacing:-0.025em;margin:0 0 14px;\">things I've helped build.<\u002Fh1>\n    <p style=\"font-size:17px;line-height:1.6;color:var(--muted);max-width:560px;margin:0 0 48px;\">A few projects where I've turned ambiguity into a clear answer: sizing markets, shaping strategy, and finding the story inside the data.<\u002Fp>\n\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:20px;letter-spacing:0.04em;\">personal projects<\u002Fdiv>\n    <div class=\"proj-card\" id=\"proj-mezzo\" style=\"background:#26211C;color:#EDE6D8;border-radius:20px;padding:34px 36px;margin-bottom:56px;\">\n      <div style=\"display:flex;align-items:center;gap:13px;margin-bottom:14px;flex-wrap:wrap;\">\n        <span style=\"font-family:'Aleo',serif;font-weight:700;font-style:italic;font-size:26px;letter-spacing:-0.015em;color:#F7F3EC;\">mezzo<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.05em;color:#26211C;background:#9CC4F2;border-radius:100px;padding:5px 12px;\">coming soon<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:20px;line-height:1.4;color:#F7F3EC;margin:0 0 10px;max-width:560px;letter-spacing:-0.01em;\">A social app where your music taste is your identity.<\u002Fp>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#B8AC9C;margin:0 0 22px;max-width:560px;\">Rank the songs you love and build a living portrait of how you hear the world. Currently in the works: a 0→1 product I'm designing and building from scratch.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#EDE6D8;background:#ffffff14;border:1px solid #ffffff1f;border-radius:100px;padding:6px 13px;\">Product<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#EDE6D8;background:#ffffff14;border:1px solid #ffffff1f;border-radius:100px;padding:6px 13px;\">Mobile<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#EDE6D8;background:#ffffff14;border:1px solid #ffffff1f;border-radius:100px;padding:6px 13px;\">0 → 1<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:20px;letter-spacing:0.04em;\">180 degrees consulting / pro-bono strategy<\u002Fdiv>\n    <div style=\"margin-bottom:56px;\">\n      <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"2\">\n        <div class=\"proj-card\" id=\"proj-{{ p.slug }}\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:34px 36px;margin-bottom:18px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:18px;\">\n            <div style=\"flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;\">\n              <div>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;color:var(--faint);margin-bottom:6px;\">{{ p.num }}<\u002Fdiv>\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;letter-spacing:-0.015em;color:var(--text);white-space:nowrap;\">{{ p.name }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;\">\n                <div style=\"color:var(--faint);\">{{ p.role }}<\u002Fdiv>\n                <div style=\"color:var(--faint);\">{{ p.period }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:14.5px;line-height:1.55;color:var(--muted);margin:0 0 16px;max-width:640px;\">{{ p.context }}<\u002Fp>\n          <p style=\"font-size:15.5px;line-height:1.65;color:var(--muted);margin:0;max-width:640px;\">{{ p.body }}<\u002Fp>\n          <div style=\"display:flex;gap:38px;flex-wrap:wrap;padding:22px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:22px 0;\">\n            <sc-for list=\"{{ p.stats }}\" as=\"s\" hint-placeholder-count=\"2\">\n              <div>\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;color:#0071E3;letter-spacing:-0.01em;\">{{ s.v }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:var(--muted);max-width:190px;line-height:1.4;margin-top:5px;\">{{ s.l }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <sc-for list=\"{{ p.tags }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);background:var(--surface-3);border-radius:100px;padding:6px 13px;\">{{ t }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsection>\n\n\n  <!-- ===== CONTACT ===== -->\n  <section id=\"contact\" class=\"sec reveal-sec\" data-screen-label=\"Contact\" style=\"max-width:1280px;margin:0 auto;padding:96px 40px 70px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:46px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:0.08em;\">005 / contact<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);\">Let's talk<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h1 class=\"big\" style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:52px;line-height:1.04;letter-spacing:-0.025em;margin:0 0 22px;max-width:640px;\">let's build something together.<\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.6;color:var(--muted);max-width:520px;margin:0 0 48px;\">I'm always happy to chat about product, finance, or where the two meet, and I'm actively looking for product management opportunities for 2027.<\u002Fp>\n\n    <div class=\"contact-grid\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:0 18px 40px -28px rgba(38,33,28,0.4);padding:38px 40px 34px;\">\n      <div class=\"contact-cols\" style=\"display:grid;grid-template-columns:1.12fr 0.88fr;gap:40px;align-items:stretch;\">\n      <div style=\"display:flex;flex-direction:column;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;color:var(--muted);text-transform:lowercase;margin-bottom:10px;\">Drop me a line<\u002Fdiv>\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:27px;letter-spacing:-0.015em;color:var(--text);margin:0;\">Send me a message!<\u002Fh2>\n\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form onsubmit=\"{{ submitMsg }}\" style=\"display:flex;flex-direction:column;gap:16px;margin-top:24px;flex:1;\">\n            <div class=\"field-row\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n            <div>\n              <label style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.06em;color:var(--faint);text-transform:lowercase;display:block;margin-bottom:7px;\">Name<\u002Flabel>\n              <input ref=\"{{ nameRef }}\" type=\"text\" placeholder=\"Your name\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color .2s,background .2s;\" style-focus=\"border-color:#0071E3;background:var(--surface);\">\n            <\u002Fdi
